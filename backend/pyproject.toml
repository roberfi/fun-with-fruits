[project]
name = "fun-with-fruits"
version = "0.0.3"
description = "An example CRUD project with FastAPI for the backend and Vue.js for the frontend"
authors = [{ name = "roberfi" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.8,<1.0",
    "uvicorn>=0.34.0,<1.0",
    "sqlalchemy>=2.0.37,<3.0.0",
    "pydantic-settings>=2.7.1,<3.0.0",
]

[dependency-groups]
test = [
    "pytest>=8.3.4,<9.0.0",
    "httpx>=0.28.1,<1.0.0",
]
dev = [
    "mypy>=1.14.1,<2.0.0",
    "ruff>=0.14.0,<1.0.0",
    "pre-commit>=4.1.0,<5.0.0",
    {include-group = "test"},
]

[tool.mypy]
python_version = "3.13"
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle error
    "EM",  # flake8-errmsg
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "PL",  # Pylint
    "RUF", # ruff-specific-rules
    "TC",  # flake8-type-checking
    "W",   # pycodestyle warning
]
